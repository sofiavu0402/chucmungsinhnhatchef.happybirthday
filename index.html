
<div id="chefBirthday">
  <canvas id="chefCanvas"></canvas>

  <button id="chefClick" type="button">Click</button>

  <div id="chefGreeting">
    <div class="chef-title">Chúc mừng sinh nhật Chef 🐟</div>
    <div class="chef-gift">Sofia sẽ cho Chef 20dh để chúc mừng :D</div>
  </div>
</div>

<style>
#chefBirthday {
  position: relative;
  width: 100%;
  min-height: 360px;
  overflow: hidden;
  box-sizing: border-box;
  border-radius: 18px;
  border: 2px solid #c3e2ff;
  background: linear-gradient(180deg,#d9edff,#edf7ff 70%,#d5e9ff);
  display: flex;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  font-family: Arial, sans-serif;
  isolation: isolate;
}

#chefCanvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  pointer-events: none;
}

#chefClick {
  position: relative;
  z-index: 2;
  padding: 9px 27px;
  border: 1px solid #a8cefa;
  border-radius: 30px;
  background: #c3e1ff;
  color: #376ba5;
  font-size: 14px;
  cursor: pointer;
  box-shadow: 0 2px 12px #a6d2ff;
  transition:
    transform .25s ease,
    box-shadow .25s ease,
    background .25s ease;
}

#chefClick:hover {
  transform: translateY(-5px) scale(1.08);
  background: #e0f0ff;
  box-shadow:
    0 8px 22px #91caff,
    0 0 18px #c3e4ff;
}

#chefClick:active {
  transform: translateY(-1px) scale(.96);
}

#chefGreeting {
  position: relative;
  z-index: 2;
  display: none;
  width: 100%;
  box-sizing: border-box;
  padding: 16px 10px;
  text-align: center;
  pointer-events: none;
}

#chefGreeting.show {
  display: block;
  animation: chefAppear 1s ease both;
}

.chef-title {
  color: #3979ba;
  font-size: clamp(23px,5vw,34px);
  font-weight: 900;
  font-style: italic;
  line-height: 1.4;
  text-shadow: 0 2px 1px white, 0 0 15px white;
}

.chef-gift {
  display: none;
  margin-top: 16px;
  color: #4d83bc;
  font-size: clamp(15px,3.5vw,20px);
  font-weight: bold;
  font-style: italic;
  text-shadow: 0 1px 4px white;
}

.chef-gift.show {
  display: block;
  animation: chefAppear .9s ease both;
}

@keyframes chefAppear {
  from {
    opacity: 0;
    transform: translateY(15px) scale(.85);
  }
  to {
    opacity: 1;
    transform: translateY(0) scale(1);
  }
}
</style>

<script>
(function () {
  const root = document.getElementById("chefBirthday");
  if (!root || root.dataset.ready) return;
  root.dataset.ready = "1";

  const canvas = document.getElementById("chefCanvas");
  const ctx = canvas.getContext("2d");
  const button = document.getElementById("chefClick");
  const greeting = document.getElementById("chefGreeting");
  const gift = root.querySelector(".chef-gift");

  let started = false;
  let rockets = [];
  let sparks = [];
  let lastLaunch = 0;
  let width = 0;
  let height = 0;
  let dpr = 1;

  const palette = [
    "#65aaff", "#9d8cff", "#64d8f2",
    "#ffffff", "#ffacd9", "#ffe18a"
  ];

  function resize() {
    const rect = root.getBoundingClientRect();
    width = rect.width;
    height = rect.height;
    dpr = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = Math.round(width * dpr);
    canvas.height = Math.round(height * dpr);
    canvas.style.width = width + "px";
    canvas.style.height = height + "px";

    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }

  function launch() {
    const color = palette[
      Math.floor(Math.random() * palette.length)
    ];

    rockets.push({
      x: width * (.12 + Math.random() * .76),
      y: height + 3,
      vx: (Math.random() - .5) * 1.2,
      vy: -(3.8 + Math.random() * 2.1),
      target: height * (.12 + Math.random() * .42),
      color: color,
      trail: []
    });
  }

  function explode(x, y, color) {
    const count = 110 + Math.floor(Math.random() * 70);

    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1.2 + Math.random() * 4.1;

      sparks.push({
        x: x,
        y: y,
        oldX: x,
        oldY: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity: .035 + Math.random() * .035,
        drag: .982 + Math.random() * .012,
        life: 70 + Math.random() * 45,
        maxLife: 115,
        size: .8 + Math.random() * 1.6,
        color: Math.random() < .2 ? "#ffffff" : color,
        twinkle: Math.random() < .4
      });
    }

    // Tia vàng lấp lánh rơi xuống
    for (let i = 0; i < 25; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = .8 + Math.random() * 2.5;

      sparks.push({
        x: x,
        y: y,
        oldX: x,
        oldY: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        gravity: .065,
        drag: .99,
        life: 100 + Math.random() * 50,
        maxLife: 150,
        size: .8 + Math.random(),
        color: "#ffe5a3",
        twinkle: true
      });
    }
  }

  function drawRocket(r) {
    r.trail.push({ x: r.x, y: r.y });
    if (r.trail.length > 10) r.trail.shift();

    r.x += r.vx;
    r.y += r.vy;
    r.vy += .025;

    ctx.beginPath();

    r.trail.forEach((point, i) => {
      if (i === 0) ctx.moveTo(point.x, point.y);
      else ctx.lineTo(point.x, point.y);
    });

    ctx.strokeStyle = r.color;
    ctx.globalAlpha = .75;
    ctx.lineWidth = 2;
    ctx.stroke();
    ctx.globalAlpha = 1;

    ctx.beginPath();
    ctx.arc(r.x, r.y, 2, 0, Math.PI * 2);
    ctx.fillStyle = "#ffffff";
    ctx.shadowBlur = 12;
    ctx.shadowColor = r.color;
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  function animate(now) {
    ctx.clearRect(0, 0, width, height);

    // Bắn nhiều quả pháo hoa liên tiếp
    if (now - lastLaunch > 350 + Math.random() * 300) {
      launch();
      if (Math.random() < .45) launch();
      lastLaunch = now;
    }

    for (let i = rockets.length - 1; i >= 0; i--) {
      const r = rockets[i];
      drawRocket(r);

      if (r.y <= r.target || r.vy >= -.2) {
        explode(r.x, r.y, r.color);
        rockets.splice(i, 1);
      }
    }

    ctx.globalCompositeOperation = "lighter";

    for (let i = sparks.length - 1; i >= 0; i--) {
      const p = sparks[i];

      p.oldX = p.x;
      p.oldY = p.y;
      p.x += p.vx;
      p.y += p.vy;
      p.vx *= p.drag;
      p.vy = p.vy * p.drag + p.gravity;
      p.life--;

      const alpha = Math.max(0, p.life / p.maxLife);
      ctx.globalAlpha = alpha;

      ctx.beginPath();
      ctx.moveTo(p.oldX, p.oldY);
      ctx.lineTo(p.x, p.y);
      ctx.strokeStyle = p.color;
      ctx.lineWidth = p.size;
      ctx.stroke();

      if (p.twinkle && Math.random() > .78) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size * 1.5, 0, Math.PI * 2);
        ctx.fillStyle = p.color;
        ctx.fill();
      }

      if (p.life <= 0) {
        sparks.splice(i, 1);
      }
    }

    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";

    requestAnimationFrame(animate);
  }

  button.addEventListener("click", function () {
    if (started) return;
    started = true;

    // Nút biến mất ngay khi bấm
    button.style.display = "none";

    // Chuẩn bị pháo hoa
    resize();

    // Sau 2 giây: bắt đầu bắn pháo hoa
    setTimeout(function () {
      lastLaunch = 0;
      requestAnimationFrame(animate);
    }, 2000);

    // Sau 5 giây: hiện lời chúc sinh nhật
    setTimeout(function () {
      greeting.classList.add("show");
    }, 5000);

    // Sau 7 giây: hiện lời chúc tặng DH
    setTimeout(function () {
      gift.classList.add("show");
    }, 7000);
  });

  window.addEventListener("resize", function () {
    if (started) resize();
  });
})();
</script>
